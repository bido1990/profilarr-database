description: '1080p Balanced targets consistent & immutable 1080p **WEB-DLs** using
  the Streaming Source and Audio Formats to determine the level of Transparency.


  - Average Movie Sizes ~ 4 to 8gb per Movie

  - Movie Quality Ranking ~ 6/10

  - Average TV Sizes ~ 2 to 4gb per Episode

  - TV Quality Ranking ~ 7/10'
