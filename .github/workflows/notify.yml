name: Notify Discord on push

on:
  push:
    branches:
      - stable
      - dev

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          python3 -c "
          import json, os, urllib.request, urllib.error
          payload = {
            'embeds': [{
              'title': f\"{os.environ['REPO']} — new push\",
              'url': f\"{os.environ['REPO_URL']}/commit/{os.environ['SHA']}\",
              'description': os.environ['COMMIT_MSG'],
              'color': 3066993,
              'fields': [
                {'name': 'Branch', 'value': os.environ['BRANCH'], 'inline': True},
                {'name': 'Author', 'value': os.environ['AUTHOR'], 'inline': True}
              ]
            }]
          }
          req = urllib.request.Request(
            os.environ['DISCORD_WEBHOOK'],
            data=json.dumps(payload).encode(),
            headers={
              'Content-Type': 'application/json',
              'User-Agent': 'DiscordBot (https://github.com, 1.0)'
            },
            method='POST'
          )
          try:
            urllib.request.urlopen(req)
            print('Notification sent successfully')
          except urllib.error.HTTPError as e:
            print(f'HTTP {e.code}: {e.read().decode()}')
            raise
          "
