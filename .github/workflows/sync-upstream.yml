name: Sync from upstream Dictionarry-Hub/database

on:
  schedule:
    - cron: '0 3 * * 0'  # ogni domenica alle 03:00 UTC
  workflow_dispatch:      # trigger manuale opzionale

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Dictionarry-Hub/database.git
          git fetch upstream

      - name: Merge upstream into fork
        run: git merge upstream/main --no-edit

      - name: Push to fork
        run: git push origin stable
